<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>部内物販・在庫管理＆POSレジ</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- jsQR for client-side QR decoding -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <!-- QRCode.js for generating printable tags -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    #cameraVideo {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      transform: scaleX(1);
    }
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: absolute; left: 0; top: 0; width: 100%; display: block !important; }
    }
  </style>
</head>
<body class="bg-neutral-900 text-neutral-100 flex flex-col min-h-screen font-sans pb-24">

  <!-- ヘッダー -->

      </div>

        <h1 class="text-sm font-bold tracking-tight text-white flex items-center gap-1.5">
          物販レジ＆在庫管理

        </h1>
        <p class="text-xs text-neutral-400">ルーム: <span id="currentRoomDisplay" class="font-mono text-neutral-200 font-semibold">POPUP-MAIN</span></p>

    </div>
    <div class="flex items-center space-x-2">

  <!-- メインコンテンツ -->

            <span id="camStatusText" class="text-xs font-semibold tracking-wider text-neutral-300">カメラ待機中</span>

              <div class="absolute -bottom-1 -left-1 w-4 h-4 border-b-2 border-l-2 border-emerald-300"></div>

  <!-- JSロジック -->
  <script>
    let state = {
      roomCode: localStorage.getItem("popup_room") || "POPUP-MAIN",
      staffName: localStorage.getItem("popup_staff") || "担当者-1",
      inventory: JSON.parse(localStorage.getItem("popup_inventory") || "[]"),
      logs: JSON.parse(localStorage.getItem("popup_logs") || "[]")
    };

    let activeStream = null;
    let scanAnimationId = null;
    let activeItem = null;
    let audioCtx = null;
    let lastScannedCode = null;
    let lastScanTime = 0;

    function playBeep(success = true) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        if (success) {
          osc.frequency.setValueAtTime(880, audioCtx.currentTime);
          osc.frequency.setValueAtTime(1320, audioCtx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.25);
        } else {
          osc.frequency.setValueAtTime(220, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        }
      } catch (e) {
        console.warn("音声再生エラー:", e);
      }
    }

    async function startScannerDirect() {
      const video = document.getElementById('cameraVideo');
      const placeholder = document.getElementById('cameraPlaceholder');
      const errBox = document.getElementById('camErrorMessage');
      const overlay = document.getElementById('scannerOverlay');
      const statusText = document.getElementById('camStatusText');

      errBox.classList.add('hidden');
      errBox.innerText = "";

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        errBox.classList.remove('hidden');
        errBox.innerText = "エラー: カメラ機能がサポートされていません。SafariでHTTPS経由で開いてください。";
        return;
      }

      try {
        const constraints = {
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        activeStream = stream;
        video.srcObject = stream;
        video.setAttribute("playsinline", true);
        video.classList.remove('hidden');
        placeholder.classList.add('hidden');
        overlay.classList.remove('hidden');
        statusText.innerText = "スキャン中";

        await video.play();

        const track = stream.getVideoTracks()[0];
        const capabilities = track.getCapabilities ? track.getCapabilities() : {};
        if (capabilities.torch) {
          document.getElementById('torchBtn').classList.remove('hidden');
        }

        requestAnimationFrame(scanVideoFrame);

      } catch (err) {
        console.error("カメラ起動エラー:", err);
        errBox.classList.remove('hidden');
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          errBox.innerText = "カメラ権限が無効です: Safariアドレスバーの「ああ」または設定アイコン → Webサイトの設定 → カメラを「許可」に変更し再読み込みしてください。";
        } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
          errBox.innerText = "利用可能なカメラが見つかりませんでした。";
        } else {
          errBox.innerText = "カメラ起動エラー: " + (err.message || err.name);
        }
      }
    }

    async function scanVideoFrame() {
      const video = document.getElementById('cameraVideo');
      const canvas = document.getElementById('qrCanvas');

      if (!activeStream || video.paused || video.ended) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        if ('BarcodeDetector' in window) {
          try {
            const barcodeDetector = new BarcodeDetector({ formats: ['qr_code', 'code_128', 'ean_13'] });
            const barcodes = await barcodeDetector.detect(video);
            if (barcodes.length > 0) {
              handleDetectedCode(barcodes[0].rawValue);
            }
          } catch (e) {
            runJsQR(video, canvas);
          }
        } else {
          runJsQR(video, canvas);
        }
      }

      scanAnimationId = requestAnimationFrame(scanVideoFrame);
    }

    function runJsQR(video, canvas) {
      if (typeof jsQR === 'undefined') return;
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height, {
        inversionAttempts: "dontInvert"
      });
      if (code && code.data) {
        handleDetectedCode(code.data);
      }
    }

    function handleDetectedCode(decodedText) {
      const now = Date.now();
      const code = decodedText.trim();
      if (lastScannedCode === code && now - lastScanTime < 2000) return;
      lastScannedCode = code;
      lastScanTime = now;

      if (navigator.vibrate) navigator.vibrate(50);
      playBeep(true);

      const item = state.inventory.find(i => i.sku.toUpperCase() === code.toUpperCase() || i.sku === code);
      if (!item) {
        alert(`スキャンコード: "${code}"\nこの商品はまだ登録されていません。「商品・在庫」タブから商品を登録してください。`);
        return;
      }
      openScanModal(item);
    }

    async function toggleFlash() {
      if (!activeStream) return;
      const track = activeStream.getVideoTracks()[0];
      try {
        const current = track.getConstraints().advanced?.find(c => 'torch' in c)?.torch || false;
        await track.applyConstraints({ advanced: [{ torch: !current }] });
      } catch (e) {
        console.warn("ライト点灯エラー", e);
      }
    }

    function handleManualSearch() {
      const code = document.getElementById('manualSkuInput').value.trim();
      if (!code) return;
      handleDetectedCode(code);
      document.getElementById('manualSkuInput').value = "";
    }

    function switchTab(tabId) {
      ['scanner', 'inventory', 'log', 'stall'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        const nav = document.getElementById(`nav-${t}`);
        nav.classList.remove('text-emerald-400');
        nav.classList.add('text-neutral-400');
      });
      document.getElementById(`tab-${tabId}`).classList.remove('hidden');
      const activeNav = document.getElementById(`nav-${tabId}`);
      activeNav.classList.remove('text-neutral-400');
      activeNav.classList.add('text-emerald-400');

      if (tabId === 'inventory') renderInventory();
      if (tabId === 'log') renderLogs();
    }

    function openScanModal(item) {
      activeItem = item;
      document.getElementById('modalSku').innerText = item.sku;
      document.getElementById('modalName').innerText = item.name;
      document.getElementById('modalPrice').innerText = `¥${Number(item.price).toLocaleString()}`;
      
      const stockEl = document.getElementById('modalStock');
      stockEl.innerText = `${item.stock} 点`;
      stockEl.className = item.stock <= 0 ? "text-lg font-bold text-rose-500 mt-0.5" : (item.stock < 5 ? "text-lg font-bold text-amber-400 mt-0.5" : "text-lg font-bold text-emerald-400 mt-0.5");

      document.getElementById('scanActionModal').classList.remove('hidden');
    }

    function closeScanModal() {
      document.getElementById('scanActionModal').classList.add('hidden');
      activeItem = null;
    }

    function executeSale(qty) {
      if (!activeItem) return;
      if (activeItem.stock < qty) {
        playBeep(false);
        alert(`在庫が不足しています！ 残り在庫は ${activeItem.stock} 点です。`);
        return;
      }

      activeItem.stock -= qty;
      activeItem.sold = (activeItem.sold || 0) + qty;

      const logEntry = {
        id: Date.now().toString(),
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
        sku: activeItem.sku,
        name: activeItem.name,
        qty: qty,
        type: '販売',
        totalPrice: activeItem.price * qty,
        staff: state.staffName
      };

      state.logs.unshift(logEntry);
      persistState();
      updateStats();
      closeScanModal();
      renderInventory();
    }

    function executeRestock(qty) {
      if (!activeItem) return;
      activeItem.stock += qty;
      const logEntry = {
        id: Date.now().toString(),
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
        sku: activeItem.sku,
        name: activeItem.name,
        qty: qty,
        type: '補充',
        totalPrice: 0,
        staff: state.staffName
      };
      state.logs.unshift(logEntry);
      persistState();
      openScanModal(activeItem);
      renderInventory();
    }

    function promptCustomSell() {
      if (!activeItem) return;
      const val = prompt(`「${activeItem.name}」の販売点数を入力してください:`, "1");
      const num = parseInt(val, 10);
      if (num && num > 0) executeSale(num);
    }

    function openAddModal() {
      document.getElementById('inpSku').value = "";
      document.getElementById('inpName').value = "";
      document.getElementById('inpPrice').value = "";
      document.getElementById('inpStock').value = "";
      document.getElementById('addModal').classList.remove('hidden');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.add('hidden');
    }

    function saveProduct() {
      const sku = document.getElementById('inpSku').value.trim() || `ITEM-${Math.floor(100 + Math.random()*900)}`;
      const name = document.getElementById('inpName').value.trim();
      const price = parseInt(document.getElementById('inpPrice').value, 10) || 0;
      const stock = parseInt(document.getElementById('inpStock').value, 10) || 0;

      if (!name) {
        alert("商品名を入力してください。");
        return;
      }

      const existingIndex = state.inventory.findIndex(i => i.sku.toUpperCase() === sku.toUpperCase());
      if (existingIndex >= 0) {
        state.inventory[existingIndex] = { ...state.inventory[existingIndex], name, price, stock };
      } else {
        state.inventory.push({ sku, name, price, stock, initialStock: stock, sold: 0 });
      }

      persistState();
      closeAddModal();
      renderInventory();
    }

    function renderInventory() {
      const list = document.getElementById('inventoryList');
      const query = (document.getElementById('inventorySearch')?.value || "").toLowerCase();
      list.innerHTML = "";

      const filtered = state.inventory.filter(i => 
        i.name.toLowerCase().includes(query) || i.sku.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="text-center p-8 text-neutral-500 text-xs border border-dashed border-neutral-700/60 rounded-2xl">
            登録された商品はありません。右上の「＋ 商品追加」から登録してください。
          </div>
        `;
        return;
      }

      filtered.forEach(item => {
        const isOut = item.stock <= 0;
        const isLow = item.stock > 0 && item.stock < 5;
        const badgeColor = isOut ? 'bg-rose-500/20 text-rose-400 border-rose-500/30' : (isLow ? 'bg-amber-500/20 text-amber-400 border-amber-500/30' : 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30');

        const card = document.createElement('div');
        card.className = "bg-neutral-800/80 border border-neutral-700/60 rounded-xl p-3.5 flex items-center justify-between";
        card.innerHTML = `
          <div>
            <div class="flex items-center gap-2">
              <span class="font-mono text-[10px] bg-neutral-900 px-1.5 py-0.5 rounded text-neutral-400 border border-neutral-800">${item.sku}</span>
              <span class="text-sm font-semibold text-white">${item.name}</span>
            </div>
            <div class="text-xs text-neutral-400 mt-1">¥${Number(item.price).toLocaleString()} • 販売済: ${item.sold || 0}点</div>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs px-2.5 py-1 rounded-lg border font-semibold ${badgeColor}">
              残り ${item.stock} 点
            </span>
            <button onclick="triggerDirectSale('${item.sku}')" class="bg-neutral-700 hover:bg-neutral-600 text-neutral-200 text-xs px-2.5 py-1 rounded-lg">
              販売
            </button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function triggerDirectSale(sku) {
      const item = state.inventory.find(i => i.sku === sku);
      if (item) openScanModal(item);
    }

    function renderLogs() {
      const container = document.getElementById('logContainer');
      container.innerHTML = "";

      if (state.logs.length === 0) {
        container.innerHTML = `<div class="text-center p-8 text-neutral-500 text-xs border border-dashed border-neutral-700/60 rounded-2xl">販売・スキャン履歴はありません。</div>`;
        return;
      }

      state.logs.slice(0, 50).forEach(log => {
        const item = document.createElement('div');
        item.className = "bg-neutral-800/60 border border-neutral-700/40 rounded-xl p-3 flex items-center justify-between text-xs";
        const isRestock = log.type === '補充';
        item.innerHTML = `
          <div>
            <div class="font-medium text-white flex items-center gap-1.5">
              <span class="${isRestock ? 'text-blue-400 font-bold' : 'text-emerald-400 font-bold'}">${isRestock ? '+ 補充' : '販売'} ${log.qty}点</span>
              <span>${log.name}</span>
            </div>
            <div class="text-[11px] text-neutral-400 mt-0.5">${log.timestamp} • 担当: ${log.staff || 'スタッフ'}</div>
          </div>
          <div class="font-semibold ${isRestock ? 'text-neutral-400' : 'text-emerald-400'}">
            ${isRestock ? '-' : `+¥${Number(log.totalPrice).toLocaleString()}`}
          </div>
        `;
        container.appendChild(item);
      });
    }

    function openPrintModal() {
      const area = document.getElementById('printArea');
      area.innerHTML = "";

      state.inventory.forEach(item => {
        const card = document.createElement('div');
        card.className = "border-2 border-dashed border-neutral-300 p-3 rounded-lg text-center flex flex-col items-center justify-between bg-white text-black";
        
        const qrContainer = document.createElement('div');
        qrContainer.className = "my-2";
        new QRCode(qrContainer, {
          text: item.sku,
          width: 90,
          height: 90,
          colorDark : "#000000",
          colorLight : "#ffffff",
          correctLevel : QRCode.CorrectLevel.M
        });

        card.innerHTML = `
          <div class="text-xs font-bold truncate max-w-[140px]">${item.name}</div>
          <div class="text-[10px] font-mono text-neutral-600">${item.sku}</div>
        `;
        card.appendChild(qrContainer);
        const footer = document.createElement('div');
        footer.className = "text-sm font-black text-black";
        footer.innerText = `¥${Number(item.price).toLocaleString()}`;
        card.appendChild(footer);

        area.appendChild(card);
      });

      document.getElementById('printModal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closePrintModal() {
      document.getElementById('printModal').classList.add('hidden');
    }

    function exportCSV(type) {
      let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; // BOM for Excel UTF-8 Japanese support
      if (type === 'summary') {
        csvContent += "品番,商品名,単価(円),持ち込み初期在庫,販売総数,残り在庫数\n";
        state.inventory.forEach(i => {
          csvContent += `"${i.sku}","${i.name}",${i.price},${i.initialStock || (i.stock + (i.sold||0))},${i.sold || 0},${i.stock}\n`;
        });
      } else {
        csvContent += "時間,区分,品番,商品名,数量,売上小計(円),担当者\n";
        state.logs.forEach(l => {
          csvContent += `"${l.timestamp}","${l.type}","${l.sku}","${l.name}",${l.qty},${l.totalPrice},"${l.staff}"\n`;
        });
      }
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `物販_${type === 'summary' ? '在庫サマリー' : '売上履歴'}_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function updateStats() {
      const totalSold = state.logs.filter(l => l.type === '販売').reduce((acc, l) => acc + l.qty, 0);
      const totalRev = state.logs.filter(l => l.type === '販売').reduce((acc, l) => acc + l.totalPrice, 0);
      document.getElementById('statTotalSold').innerText = `${totalSold} 点`;
      document.getElementById('statTotalRev').innerText = `¥${Number(totalRev).toLocaleString()}`;
    }

    function persistState() {
      localStorage.setItem("popup_inventory", JSON.stringify(state.inventory));
      localStorage.setItem("popup_logs", JSON.stringify(state.logs));
      localStorage.setItem("popup_room", state.roomCode);
      localStorage.setItem("popup_staff", state.staffName);
    }

    function saveStallSettings() {
      const room = document.getElementById('roomCodeInput').value.trim().toUpperCase() || "POPUP-MAIN";
      const staff = document.getElementById('staffNameInput').value.trim() || "担当者";
      state.roomCode = room;
      state.staffName = staff;
      document.getElementById('currentRoomDisplay').innerText = room;
      document.getElementById('staffNameDisplay').innerText = staff;
      persistState();
      alert(`設定を保存しました。ルーム: ${room} / 担当: ${staff}`);
      switchTab('scanner');
    }

    function loadSampleProducts() {
      state.inventory = [
        { sku: "ZINE-01", name: "自主制作ZINE 創刊号", price: 500, stock: 25, initialStock: 25, sold: 0 },
        { sku: "STICKER-PK", name: "ステッカーパック (3枚入)", price: 300, stock: 40, initialStock: 40, sold: 0 },
        { sku: "POST-A4", name: "A4 リソグラフポスター", price: 800, stock: 15, initialStock: 15, sold: 0 },
        { sku: "TOTE-BAG", name: "シルクスクリーン トートバッグ", price: 1500, stock: 10, initialStock: 10, sold: 0 }
      ];
      persistState();
      renderInventory();
      alert("サンプル商品（4品）を読み込みました。");
      switchTab('inventory');
    }

    function clearAllData() {
      if (confirm("すべての商品データおよび売上履歴をリセットしてもよろしいですか？")) {
        state.inventory = [];
        state.logs = [];
        persistState();
        renderInventory();
        renderLogs();
        updateStats();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      document.getElementById('roomCodeInput').value = state.roomCode;
      document.getElementById('staffNameInput').value = state.staffName;
      document.getElementById('currentRoomDisplay').innerText = state.roomCode;
      document.getElementById('staffNameDisplay').innerText = state.staffName;
      updateStats();
      renderInventory();
    });
  </script>
</body>
</html>
